services:
  backend:
    image: ghcr.io/winglight/algo-trader/backend:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-backend
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      APP_MANAGED_SERVICES: "api|http://backend:8000/healthz|||restart_mode=disabled;broker-runner|http://broker-runner-service:8115/healthz|||restart_mode=disabled;account|http://account-service:8100/healthz|||restart_mode=disabled;orders|http://orders-service:8101/healthz|||restart_mode=disabled;market-data|http://market-data-service:8102/healthz|||restart_mode=disabled;risk|http://risk-service:8103/healthz|||restart_mode=disabled;strategy|http://strategy-service:8104/healthz|||restart_mode=disabled;simulation|http://simulation-service:8111/healthz|||restart_mode=disabled;strategy-spec|http://strategy-spec-service:8114/healthz|||restart_mode=disabled"
      OPTIONAL_DISCOVERY_SERVICES: audit,simulation,strategy-spec
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.10

  broker-runner-service:
    image: ghcr.io/winglight/algo-trader/broker-runner-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-broker-runner
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      BROKER_RUNNER_ADAPTER_ENTRYPOINT: ${BROKER_RUNNER_ADAPTER_ENTRYPOINT:-src.broker_adapters.sim:create_adapter}
      BROKER_RUNNER_IB_GATEWAY_HOST: ${BROKER_RUNNER_IB_GATEWAY_HOST:-ib-gateway}
      BROKER_RUNNER_IB_GATEWAY_PORT: ${BROKER_RUNNER_IB_GATEWAY_PORT:-4004}
      BROKER_RUNNER_IB_CLIENT_ID: ${BROKER_RUNNER_IB_CLIENT_ID:-40}
      BROKER_RUNNER_IB_CLIENT_ID_FALLBACKS: ${BROKER_RUNNER_IB_CLIENT_ID_FALLBACKS:-}
      BROKER_RUNNER_IB_CONNECT_TIMEOUT: ${BROKER_RUNNER_IB_CONNECT_TIMEOUT:-15.0}
      BROKER_RUNNER_IB_READ_ONLY: ${BROKER_RUNNER_IB_READ_ONLY:-false}
      BROKER_RUNNER_IB_ACCOUNT: ${BROKER_RUNNER_IB_ACCOUNT:-}
      BROKER_RUNNER_IB_MARKET_DATA_DEPTH_ROWS: ${BROKER_RUNNER_IB_MARKET_DATA_DEPTH_ROWS:-10}
      BROKER_RUNNER_IB_MARKET_DATA_QUEUE_SIZE: ${BROKER_RUNNER_IB_MARKET_DATA_QUEUE_SIZE:-64}
      BROKER_RUNNER_IB_HISTORICAL_TIMEOUT: ${BROKER_RUNNER_IB_HISTORICAL_TIMEOUT:-300.0}
      BROKER_RUNNER_SERVICE_REGISTRY_URL: http://broker-runner-service:8115
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.25

  account-service:
    image: ghcr.io/winglight/algo-trader/account-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-account
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      ACCOUNT_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.21.0.11

  orders-service:
    image: ghcr.io/winglight/algo-trader/orders-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-orders
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      ORDERS_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.21.0.12

  market-data-service:
    image: ghcr.io/winglight/algo-trader/market-data-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-market-data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      MARKET_DATA_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.21.0.13

  risk-service:
    image: ghcr.io/winglight/algo-trader/risk-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-risk
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      RISK_SERVICE_NAME: risk
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.14

  simulation-service:
    image: ghcr.io/winglight/algo-trader/sim-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-sim
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      SIM_SERVICE_REGISTRY_NAME: simulation
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.16

  strategy-spec-service:
    image: ghcr.io/winglight/algo-trader/strategy-spec-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-strategy-spec
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      STRATEGY_SPEC_SERVICE_REGISTRY_NAME: strategy-spec
    command: ["/bin/sh", "./docker/start_strategy_spec_service.sh"]
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.17

  strategy-service:
    image: ghcr.io/winglight/algo-trader/strategy-service:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-strategy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      API_SERVICE_URL: http://backend:8000
      STRATEGY_SERVICE_REGISTRY_NAME: strategy
    restart: unless-stopped
    depends_on:
      orders-service:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.21.0.15

  service-watchdog:
    image: ghcr.io/winglight/algo-trader/backend:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-service-watchdog
    profiles:
      - ib
    command:
      [
        "python3",
        "tools/service_watchdog.py",
        "--interval",
        "60",
        "--startup-delay",
        "20",
        "--timeout",
        "5",
        "--max-failures",
        "9999",
        "--collector-enabled",
        "0",
        "--strategy-stream-enabled",
        "0",
      ]
    environment:
      SERVICE_WATCHDOG_SERVICES: "api|http://backend:8000/healthz|||restart_mode=disabled"
      SERVICE_WATCHDOG_IB_GATEWAY_ENABLED: "1"
      SERVICE_WATCHDOG_IB_GATEWAY_CONTAINER: ib-gateway
      SERVICE_WATCHDOG_IB_GATEWAY_DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.21.0.26

  frontend:
    image: ghcr.io/winglight/algo-trader/frontend:${ATI_IMAGE_TAG:-0.1.0}
    container_name: algo-trader-frontend
    ports:
      - "127.0.0.1:5173:80"
    environment:
      VITE_API_BASE_URL: ""
      VITE_WS_URL: ""
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.27

networks:
  default:
    name: stack
    external: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
