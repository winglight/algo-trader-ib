services:
  backend:
    image: ghcr.io/winglight/algo-trader/backend:latest
    container_name: algo-trader-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.10

  account-service:
    image: ghcr.io/winglight/algo-trader/account-service:latest
    container_name: algo-trader-account
    ports:
      - "8100:8100"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.11

  orders-service:
    image: ghcr.io/winglight/algo-trader/orders-service:latest
    container_name: algo-trader-orders
    ports:
      - "8101:8101"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.12

  market-data-service:
    image: ghcr.io/winglight/algo-trader/market-data-service:latest
    container_name: algo-trader-market-data
    ports:
      - "8102:8102"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.13

  risk-service:
    image: ghcr.io/winglight/algo-trader/risk-service:latest
    container_name: algo-trader-risk
    ports:
      - "8103:8103"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.14

  strategy-service:
    image: ghcr.io/winglight/algo-trader/strategy-service:latest
    container_name: algo-trader-strategy
    ports:
      - "8104:8104"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    restart: unless-stopped
    depends_on:
      orders-service:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.21.0.15

  strategy-watchdog:
    image: ghcr.io/winglight/algo-trader/backend:latest
    container_name: algo-trader-strategy-watchdog
    command:
      [
        "python3",
        "tools/strategy_watchdog.py",
        "--interval",
        "60",
        "--startup-delay",
        "15",
        "--dom-threshold",
        "120",
        "--bar-threshold",
        "120"
      ]
    environment:
      API_SERVICE_URL: http://backend:8000
      WATCHDOG_RESTART_MODE: api
      STRATEGY_SERVICE_REGISTRY_DOCKER_CONTAINER: algo-trader-strategy
      STRATEGY_SERVICE_REGISTRY_DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      strategy-service:
        condition: service_started
      market-data-service:
        condition: service_started

  service-watchdog:
    image: ghcr.io/winglight/algo-trader/backend:latest
    container_name: algo-trader-service-watchdog
    command:
      [
        "python3",
        "tools/service_watchdog.py",
        "--interval",
        "20",
        "--startup-delay",
        "20",
        "--timeout",
        "3",
        "--max-failures",
        "3",
        "--restart-timeout",
        "30",
        "--restart-cooldown",
        "90",
      ]
    environment:
      SERVICE_WATCHDOG_SERVICES: "api|http://backend:8000/healthz||restart_mode=docker,docker_container=algo-trader-backend,docker_host=unix:///var/run/docker.sock;account|http://account-service:8100/healthz||restart_mode=docker,docker_container=algo-trader-account,docker_host=unix:///var/run/docker.sock;orders|http://orders-service:8101/healthz||restart_mode=docker,docker_container=algo-trader-orders,docker_host=unix:///var/run/docker.sock;market-data|http://market-data-service:8102/healthz||restart_mode=docker,docker_container=algo-trader-market-data,docker_host=unix:///var/run/docker.sock;risk|http://risk-service:8103/healthz||restart_mode=docker,docker_container=algo-trader-risk,docker_host=unix:///var/run/docker.sock;strategy|http://strategy-service:8104/healthz||restart_mode=docker,docker_container=algo-trader-strategy,docker_host=unix:///var/run/docker.sock"
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      account-service:
        condition: service_started
      orders-service:
        condition: service_started
      market-data-service:
        condition: service_started
      risk-service:
        condition: service_started
      strategy-service:
        condition: service_started

  cf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: algo-trader-cf-tunnel
    profiles:
      - cf-tunnel
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CF_TUNNEL_TOKEN}"
      ]
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.21.0.16

  frontend:
    image: ghcr.io/winglight/algo-trader/frontend:latest
    container_name: algo-trader-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://backend:8000
      VITE_WS_URL: ws://backend:8000/ws
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

networks:
  default:
    name: stack
    external: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
