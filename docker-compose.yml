services:
  backend:
    image: ghcr.io/winglight/algo-trader/backend:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-backend
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      APP_MANAGED_SERVICES: "api|http://backend:8000/healthz|||restart_mode=watchdog;broker-runner|http://broker-runner-service:8115/healthz|||restart_mode=watchdog;account|http://account-service:8100/healthz|||restart_mode=watchdog;orders|http://orders-service:8101/healthz|||restart_mode=watchdog;market-data|http://market-data-service:8102/healthz|||restart_mode=watchdog;risk|http://risk-service:8103/healthz|||restart_mode=watchdog;strategy|http://strategy-service:8104/healthz|||restart_mode=watchdog;simulation|http://simulation-service:8111/healthz|||restart_mode=watchdog;strategy-spec|http://strategy-spec-service:8114/healthz|||restart_mode=watchdog"
      SERVICE_WATCHDOG_URL: http://service-watchdog:8110
      OPTIONAL_DISCOVERY_SERVICES: audit,simulation,strategy-spec
      BROKER_ADAPTER_SWITCH_ENABLED: ${BROKER_ADAPTER_SWITCH_ENABLED}
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED}
      BROKER_ADAPTER_SWITCH_POSITION_OVERRIDE_ENABLED: ${BROKER_ADAPTER_SWITCH_POSITION_OVERRIDE_ENABLED}
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.10

  broker-runner-service:
    image: ${BROKER_RUNNER_IMAGE:-ghcr.io/winglight/algo-trader/broker-runner-service:${ATI_IMAGE_TAG:-latest}}
    container_name: algo-trader-broker-runner
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      BROKER_RUNNER_PROFILE_REGISTRY_ENABLED: ${BROKER_RUNNER_PROFILE_REGISTRY_ENABLED}
      BROKER_RUNNER_ENABLED_ADAPTERS: ${BROKER_RUNNER_ENABLED_ADAPTERS}
      BROKER_RUNNER_DEFAULT_ADAPTER_ID: ${BROKER_RUNNER_DEFAULT_ADAPTER_ID}
      BROKER_RUNNER_ACTIVE_ADAPTER_REDIS_KEY: ${BROKER_RUNNER_ACTIVE_ADAPTER_REDIS_KEY}
      BROKER_RUNNER_IBKR_PAPER_PROVIDER: ${BROKER_RUNNER_IBKR_PAPER_PROVIDER}
      BROKER_ASSET_CAPABILITY_GATE_ENABLED: ${BROKER_ASSET_CAPABILITY_GATE_ENABLED}
      BROKER_RUNNER_IB_GATEWAY_HOST: ${BROKER_RUNNER_IB_GATEWAY_HOST:-ib-gateway}
      BROKER_RUNNER_IB_GATEWAY_PORT: ${BROKER_RUNNER_IB_GATEWAY_PORT:-4004}
      BROKER_RUNNER_IB_CLIENT_ID: ${BROKER_RUNNER_IB_CLIENT_ID:-40}
      BROKER_RUNNER_IB_CLIENT_ID_FALLBACKS: ${BROKER_RUNNER_IB_CLIENT_ID_FALLBACKS:-}
      BROKER_RUNNER_IB_CONNECT_TIMEOUT: ${BROKER_RUNNER_IB_CONNECT_TIMEOUT:-15.0}
      BROKER_RUNNER_IB_READ_ONLY: ${BROKER_RUNNER_IB_READ_ONLY:-false}
      BROKER_RUNNER_IB_ACCOUNT: ${BROKER_RUNNER_IB_ACCOUNT:-}
      BROKER_RUNNER_IB_MARKET_DATA_DEPTH_ROWS: ${BROKER_RUNNER_IB_MARKET_DATA_DEPTH_ROWS:-10}
      BROKER_RUNNER_IB_MARKET_DATA_QUEUE_SIZE: ${BROKER_RUNNER_IB_MARKET_DATA_QUEUE_SIZE:-64}
      BROKER_RUNNER_IB_HISTORICAL_TIMEOUT: ${BROKER_RUNNER_IB_HISTORICAL_TIMEOUT:-300.0}
      BROKER_RUNNER_ALPACA_API_KEY_ID: ${BROKER_RUNNER_ALPACA_API_KEY_ID:-}
      BROKER_RUNNER_ALPACA_SECRET_KEY: ${BROKER_RUNNER_ALPACA_SECRET_KEY:-}
      BROKER_RUNNER_ALPACA_DATA_FEED: ${BROKER_RUNNER_ALPACA_DATA_FEED:-iex}
      BROKER_RUNNER_ALPACA_REQUEST_TIMEOUT_SECONDS: ${BROKER_RUNNER_ALPACA_REQUEST_TIMEOUT_SECONDS:-15.0}
      BROKER_RUNNER_ALPACA_RECONCILE_LOOKBACK_HOURS: ${BROKER_RUNNER_ALPACA_RECONCILE_LOOKBACK_HOURS:-72}
      BROKER_RUNNER_ALPACA_MAX_CONCURRENCY: ${BROKER_RUNNER_ALPACA_MAX_CONCURRENCY:-8}
      BROKER_RUNNER_ALPACA_STREAM_QUEUE_SIZE: ${BROKER_RUNNER_ALPACA_STREAM_QUEUE_SIZE:-512}
      BROKER_RUNNER_SERVICE_REGISTRY_URL: http://broker-runner-service:8115
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.25

  account-service:
    image: ghcr.io/winglight/algo-trader/account-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-account
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      ACCOUNT_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.11

  orders-service:
    image: ghcr.io/winglight/algo-trader/orders-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-orders
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      ORDERS_BROKER_RUNNER_URL: http://broker-runner-service:8115
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED}
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.12

  market-data-service:
    image: ghcr.io/winglight/algo-trader/market-data-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-market-data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      MARKET_DATA_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.13

  risk-service:
    image: ghcr.io/winglight/algo-trader/risk-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-risk
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      RISK_SERVICE_NAME: risk
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.14

  simulation-service:
    image: ghcr.io/winglight/algo-trader/sim-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-sim
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      SIM_SERVICE_REGISTRY_NAME: simulation
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.16

  strategy-spec-service:
    image: ghcr.io/winglight/algo-trader/strategy-spec-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-strategy-spec
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      STRATEGY_SPEC_SERVICE_REGISTRY_NAME: strategy-spec
      BROKER_ASSET_CAPABILITY_GATE_ENABLED: ${BROKER_ASSET_CAPABILITY_GATE_ENABLED}
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED}
    command: ["/bin/sh", "./docker/start_strategy_spec_service.sh"]
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.17

  strategy-service:
    image: ghcr.io/winglight/algo-trader/strategy-service:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-strategy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      API_SERVICE_URL: http://backend:8000
      STRATEGY_SERVICE_REGISTRY_NAME: strategy
      BROKER_ASSET_CAPABILITY_GATE_ENABLED: ${BROKER_ASSET_CAPABILITY_GATE_ENABLED}
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED}
    restart: unless-stopped
    depends_on:
      orders-service:
        condition: service_started
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.15

  service-watchdog:
    image: ghcr.io/winglight/algo-trader/backend:${ATI_IMAGE_TAG:-latest}
    container_name: algo-trader-service-watchdog
    env_file:
      - path: ./config/service_watchdog_public.env.example
      - path: ./config/service_watchdog.env
        required: false
    command: ["python3", "tools/service_watchdog.py"]
    ports:
      - "127.0.0.1:${SERVICE_WATCHDOG_PORT:-8110}:8110"
    environment:
      REDIS_URL: ${REDIS_URL}
      SERVICE_WATCHDOG_IB_GATEWAY_ENABLED: ${SERVICE_WATCHDOG_IB_GATEWAY_ENABLED:-0}
      SERVICE_WATCHDOG_IB_GATEWAY_CONTAINER: ${SERVICE_WATCHDOG_IB_GATEWAY_CONTAINER:-ib-gateway}
      SERVICE_WATCHDOG_IB_GATEWAY_DOCKER_HOST: ${SERVICE_WATCHDOG_IB_GATEWAY_DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      broker-runner-service:
        condition: service_started
      account-service:
        condition: service_started
      orders-service:
        condition: service_started
      market-data-service:
        condition: service_started
      risk-service:
        condition: service_started
      simulation-service:
        condition: service_started
      strategy-spec-service:
        condition: service_started
      strategy-service:
        condition: service_started
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.26

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/winglight/algo-trader/frontend:${ATI_IMAGE_TAG:-latest}}
    container_name: algo-trader-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${ATI_NETWORK_PREFIX:-172.21.0}.27

networks:
  default:
    name: ${ATI_NETWORK_NAME:-stack}
    external: true
    ipam:
      driver: default
      config:
        - subnet: ${ATI_NETWORK_SUBNET:-172.21.0.0/16}
