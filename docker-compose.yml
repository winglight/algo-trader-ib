services:
  backend:
    image: ghcr.io/winglight/algo-trader/backend:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-backend
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    env_file:
      - path: ./config/screeners_service.env.example
      - path: ./config/screeners_service.env
        required: false
    environment:
      APP_MANAGED_SERVICES: "api|http://backend:8000/healthz|||restart_mode=watchdog;broker-runner|http://broker-runner-service:8115/healthz|||restart_mode=watchdog;account|http://account-service:8100/healthz|||restart_mode=watchdog;orders|http://orders-service:8101/healthz|||restart_mode=watchdog;market-data|http://market-data-service:8102/healthz|||restart_mode=watchdog;risk|http://risk-service:8103/healthz|||restart_mode=watchdog;strategy|http://strategy-service:8104/healthz|||restart_mode=watchdog;simulation|http://simulation-service:8111/healthz|||restart_mode=watchdog;strategy-spec|http://strategy-spec-service:8114/healthz|||restart_mode=watchdog;screeners|http://screeners-service:8116/healthz|||restart_mode=watchdog"
      SERVICE_WATCHDOG_URL: http://service-watchdog:8110
      OPTIONAL_DISCOVERY_SERVICES: audit,simulation,strategy-spec,screeners
      BROKER_ADAPTER_SWITCH_ENABLED: ${BROKER_ADAPTER_SWITCH_ENABLED:-true}
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED:-true}
      BROKER_ADAPTER_SWITCH_POSITION_OVERRIDE_ENABLED: ${BROKER_ADAPTER_SWITCH_POSITION_OVERRIDE_ENABLED:-false}
    restart: unless-stopped

  broker-runner-service:
    image: ${BROKER_RUNNER_IMAGE:-ghcr.io/winglight/algo-trader/broker-runner-service:${ATI_IMAGE_TAG:-latest}}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-broker-runner
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      BROKER_RUNNER_PROFILE_REGISTRY_ENABLED: ${BROKER_RUNNER_PROFILE_REGISTRY_ENABLED:-true}
      BROKER_RUNNER_PLUGIN_PATH: ${BROKER_RUNNER_PLUGIN_PATH:-/app/data/broker-plugins}
      PYTHONPATH: ${BROKER_RUNNER_PLUGIN_PATH:-/app/data/broker-plugins}:/app/packages/ati-shared-sdk/src:/app/src
      BROKER_RUNNER_ENABLED_ADAPTERS: ${BROKER_RUNNER_ENABLED_ADAPTERS:-sim}
      BROKER_RUNNER_DEFAULT_ADAPTER_ID: ${BROKER_RUNNER_DEFAULT_ADAPTER_ID:-sim}
      BROKER_RUNNER_ACTIVE_ADAPTER_REDIS_KEY: ${BROKER_RUNNER_ACTIVE_ADAPTER_REDIS_KEY:-broker_runner:active_adapter_id}
      BROKER_RUNNER_IBKR_PAPER_PROVIDER: ${BROKER_RUNNER_IBKR_PAPER_PROVIDER:-core}
      BROKER_ASSET_CAPABILITY_GATE_ENABLED: ${BROKER_ASSET_CAPABILITY_GATE_ENABLED:-true}
      BROKER_RUNNER_IB_GATEWAY_HOST: ${BROKER_RUNNER_IB_GATEWAY_HOST:-ib-gateway}
      BROKER_RUNNER_IB_GATEWAY_PORT: ${BROKER_RUNNER_IB_GATEWAY_PORT:-4004}
      BROKER_RUNNER_IB_CLIENT_ID: ${BROKER_RUNNER_IB_CLIENT_ID:-40}
      BROKER_RUNNER_IB_CLIENT_ID_FALLBACKS: ${BROKER_RUNNER_IB_CLIENT_ID_FALLBACKS:-}
      BROKER_RUNNER_IB_CONNECT_TIMEOUT: ${BROKER_RUNNER_IB_CONNECT_TIMEOUT:-15.0}
      BROKER_RUNNER_IB_READ_ONLY: ${BROKER_RUNNER_IB_READ_ONLY:-false}
      BROKER_RUNNER_IB_ACCOUNT: ${BROKER_RUNNER_IB_ACCOUNT:-}
      BROKER_RUNNER_IB_MARKET_DATA_DEPTH_ROWS: ${BROKER_RUNNER_IB_MARKET_DATA_DEPTH_ROWS:-10}
      BROKER_RUNNER_IB_MARKET_DATA_QUEUE_SIZE: ${BROKER_RUNNER_IB_MARKET_DATA_QUEUE_SIZE:-64}
      BROKER_RUNNER_IB_HISTORICAL_TIMEOUT: ${BROKER_RUNNER_IB_HISTORICAL_TIMEOUT:-300.0}
      BROKER_RUNNER_ALPACA_API_KEY_ID: ${BROKER_RUNNER_ALPACA_API_KEY_ID:-}
      BROKER_RUNNER_ALPACA_SECRET_KEY: ${BROKER_RUNNER_ALPACA_SECRET_KEY:-}
      BROKER_RUNNER_ALPACA_DATA_FEED: ${BROKER_RUNNER_ALPACA_DATA_FEED:-iex}
      BROKER_RUNNER_ALPACA_REQUEST_TIMEOUT_SECONDS: ${BROKER_RUNNER_ALPACA_REQUEST_TIMEOUT_SECONDS:-15.0}
      BROKER_RUNNER_ALPACA_RECONCILE_LOOKBACK_HOURS: ${BROKER_RUNNER_ALPACA_RECONCILE_LOOKBACK_HOURS:-72}
      BROKER_RUNNER_ALPACA_MAX_CONCURRENCY: ${BROKER_RUNNER_ALPACA_MAX_CONCURRENCY:-8}
      BROKER_RUNNER_ALPACA_STREAM_QUEUE_SIZE: ${BROKER_RUNNER_ALPACA_STREAM_QUEUE_SIZE:-512}
      BROKER_RUNNER_CCXT_CRYPTO_EXCHANGE_ID: ${BROKER_RUNNER_CCXT_CRYPTO_EXCHANGE_ID:-okx}
      BROKER_RUNNER_CCXT_CRYPTO_SANDBOX: ${BROKER_RUNNER_CCXT_CRYPTO_SANDBOX:-true}
      BROKER_RUNNER_CCXT_CRYPTO_LIVE: ${BROKER_RUNNER_CCXT_CRYPTO_LIVE:-false}
      BROKER_RUNNER_CCXT_CRYPTO_API_KEY: ${BROKER_RUNNER_CCXT_CRYPTO_API_KEY:-}
      BROKER_RUNNER_CCXT_CRYPTO_SECRET: ${BROKER_RUNNER_CCXT_CRYPTO_SECRET:-}
      BROKER_RUNNER_CCXT_CRYPTO_PASSPHRASE: ${BROKER_RUNNER_CCXT_CRYPTO_PASSPHRASE:-}
      BROKER_RUNNER_CCXT_CRYPTO_ALLOWED_SYMBOLS: ${BROKER_RUNNER_CCXT_CRYPTO_ALLOWED_SYMBOLS:-BTC/USDT,ETH/USDT}
      BROKER_RUNNER_CCXT_CRYPTO_EXECUTION_TARGET_ID: ${BROKER_RUNNER_CCXT_CRYPTO_EXECUTION_TARGET_ID:-okx-spot-demo-paper-1}
      BROKER_RUNNER_CCXT_CRYPTO_MARKET_DATA_TARGET_ID: ${BROKER_RUNNER_CCXT_CRYPTO_MARKET_DATA_TARGET_ID:-okx-spot-demo-market-1}
      BROKER_RUNNER_CCXT_CRYPTO_REQUEST_TIMEOUT_MS: ${BROKER_RUNNER_CCXT_CRYPTO_REQUEST_TIMEOUT_MS:-30000}
      BROKER_RUNNER_SERVICE_REGISTRY_URL: http://broker-runner-service:8115
    restart: unless-stopped

  account-service:
    image: ghcr.io/winglight/algo-trader/account-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-account
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      ACCOUNT_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started

  orders-service:
    image: ghcr.io/winglight/algo-trader/orders-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-orders
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      ORDERS_BROKER_RUNNER_URL: http://broker-runner-service:8115
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED:-true}
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started

  market-data-service:
    image: ghcr.io/winglight/algo-trader/market-data-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-market-data
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      MARKET_DATA_BROKER_RUNNER_URL: http://broker-runner-service:8115
    restart: unless-stopped
    depends_on:
      broker-runner-service:
        condition: service_started

  risk-service:
    image: ghcr.io/winglight/algo-trader/risk-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-risk
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      RISK_SERVICE_NAME: risk
    restart: unless-stopped

  simulation-service:
    image: ghcr.io/winglight/algo-trader/sim-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-sim
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      SIM_SERVICE_REGISTRY_NAME: simulation
    restart: unless-stopped

  strategy-spec-service:
    image: ghcr.io/winglight/algo-trader/strategy-spec-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-strategy-spec
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      STRATEGY_SPEC_SERVICE_REGISTRY_NAME: strategy-spec
      BROKER_ASSET_CAPABILITY_GATE_ENABLED: ${BROKER_ASSET_CAPABILITY_GATE_ENABLED:-true}
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED:-true}
    command: ["/bin/sh", "./docker/start_strategy_spec_service.sh"]
    restart: unless-stopped

  strategy-service:
    image: ghcr.io/winglight/algo-trader/strategy-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-strategy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./strategies:/app/src/strategies
      - ./.env:/app/.env:ro
      - ./config:/app/config
    environment:
      API_SERVICE_URL: http://backend:8000
      STRATEGY_SERVICE_REGISTRY_NAME: strategy
      BROKER_ASSET_CAPABILITY_GATE_ENABLED: ${BROKER_ASSET_CAPABILITY_GATE_ENABLED:-true}
      BROKER_ADAPTER_SWITCH_GATE_ENABLED: ${BROKER_ADAPTER_SWITCH_GATE_ENABLED:-true}
    restart: unless-stopped
    depends_on:
      orders-service:
        condition: service_started

  screeners-service:
    image: ghcr.io/winglight/algo-trader/screeners-service:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-screeners
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./config:/app/config
    env_file:
      - path: ./config/screeners_service.env.example
      - path: ./config/screeners_service.env
        required: false
    environment:
      SCREENERS_SERVICE_REGISTRY_HOST: screeners-service
      SCREENERS_SERVICE_REGISTRY_DOCKER_CONTAINER: ${ATI_CONTAINER_PREFIX:-algo-trader}-screeners
      SCREENERS_BROKER_RUNNER_SERVICE_URL: http://broker-runner-service:8115
      SCREENERS_STRATEGY_SPEC_SERVICE_URL: http://strategy-spec-service:8114
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8116/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      broker-runner-service:
        condition: service_started
      strategy-spec-service:
        condition: service_started
    restart: unless-stopped

  service-watchdog:
    image: ghcr.io/winglight/algo-trader/backend:${ATI_IMAGE_TAG:-latest}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-service-watchdog
    env_file:
      - path: ./config/service_watchdog_public.env.example
      - path: ./config/service_watchdog.env
        required: false
    command: ["python3", "tools/service_watchdog.py"]
    ports:
      - "127.0.0.1:${SERVICE_WATCHDOG_PORT:-8110}:8110"
    environment:
      REDIS_URL: ${REDIS_URL}
      MARIADB_URL: ${MARIADB_URL}
      SERVICE_WATCHDOG_MAINTENANCE_TOKEN: ${SERVICE_WATCHDOG_MAINTENANCE_TOKEN:-}
      SERVICE_WATCHDOG_PHASE1_OFFLINE_ORDERS_PREFLIGHT: ${SERVICE_WATCHDOG_PHASE1_OFFLINE_ORDERS_PREFLIGHT:-0}
      SERVICE_WATCHDOG_SERVICES: "api|http://backend:8000/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-backend,docker_host=unix:///var/run/docker.sock;broker-runner|http://broker-runner-service:8115/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-broker-runner,docker_host=unix:///var/run/docker.sock;account|http://account-service:8100/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-account,docker_host=unix:///var/run/docker.sock;orders|http://orders-service:8101/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-orders,docker_host=unix:///var/run/docker.sock;market-data|http://market-data-service:8102/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-market-data,docker_host=unix:///var/run/docker.sock;risk|http://risk-service:8103/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-risk,docker_host=unix:///var/run/docker.sock;strategy|http://strategy-service:8104/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-strategy,docker_host=unix:///var/run/docker.sock;simulation|http://simulation-service:8111/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-sim,docker_host=unix:///var/run/docker.sock;strategy-spec|http://strategy-spec-service:8114/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-strategy-spec,docker_host=unix:///var/run/docker.sock;screeners|http://screeners-service:8116/healthz|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-screeners,docker_host=unix:///var/run/docker.sock;frontend|http://frontend/|||restart_mode=docker,docker_container=${ATI_CONTAINER_PREFIX:-algo-trader}-frontend,docker_host=unix:///var/run/docker.sock"
      SERVICE_WATCHDOG_IB_GATEWAY_ENABLED: ${SERVICE_WATCHDOG_IB_GATEWAY_ENABLED:-0}
      SERVICE_WATCHDOG_IB_GATEWAY_CONTAINER: ${SERVICE_WATCHDOG_IB_GATEWAY_CONTAINER:-ib-gateway}
      SERVICE_WATCHDOG_IB_GATEWAY_DOCKER_HOST: ${SERVICE_WATCHDOG_IB_GATEWAY_DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      broker-runner-service:
        condition: service_started
      account-service:
        condition: service_started
      orders-service:
        condition: service_started
      market-data-service:
        condition: service_started
      risk-service:
        condition: service_started
      simulation-service:
        condition: service_started
      strategy-spec-service:
        condition: service_started
      strategy-service:
        condition: service_started
      screeners-service:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/winglight/algo-trader/frontend:${ATI_IMAGE_TAG:-latest}}
    container_name: ${ATI_CONTAINER_PREFIX:-algo-trader}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

networks:
  default:
    name: ${ATI_NETWORK_NAME:-stack}
    external: true
