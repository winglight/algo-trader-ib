networks:
  stack:
    name: ${ATI_NETWORK_NAME:-stack}
    external: true



services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    command: >
      sh -c 'redis-server
      --save 20 1
      --appendonly yes
      --appendfsync everysec
      --aof-use-rdb-preamble yes
      --loglevel warning
      --requirepass "$$REDIS_PASSWORD"'
    environment:
      - TZ=${TZ}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - stack

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - 3306:3306
    environment:
      - TZ=UTC
      - MYSQL_ROOT_PASSWORD=${MARIADB_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - stack

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    profiles:
      - ib
    container_name: ${ATI_IB_GATEWAY_CONTAINER_NAME:-ib-gateway}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - TWS_USERID=${TWS_USERID}
      - TWS_PASSWORD=${TWS_PASSWORD}
      - TRADING_MODE=paper
      - TWS_SETTINGS_PATH=/home/ibgateway/tws_settings
      - READ_ONLY_API=no
      - API_PORT=4004
      - VNC_SERVER_PASSWORD=${VNC_SERVER_PASSWORD}
      - TWOFA_TIMEOUT_ACTION=restart
      - RELOGIN_AFTER_TWOFA_TIMEOUT=yes
      - ALLOW_BLIND_TRADING=no
    volumes:
      - ./data/ib-gateway/tws_settings:/home/ibgateway/tws_settings
    networks:
      - stack

volumes:
  redis-data:
    name: ${ATI_REDIS_VOLUME_NAME:-ati-local-runtime-redis-data}
  mariadb-data:
