name: Installer permissions

on:
  pull_request:
    paths:
      - setup_and_run.sh
      - scripts/installer_lib.sh
      - tests/test_installer_permissions.py
      - .github/workflows/installer-permissions.yml
  push:
    branches: [main]
    paths:
      - setup_and_run.sh
      - scripts/installer_lib.sh
      - tests/test_installer_permissions.py
      - .github/workflows/installer-permissions.yml

permissions:
  contents: read

jobs:
  installer-permissions:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: bash -n setup_and_run.sh
      - run: python -m pytest -q tests/test_installer_permissions.py tests/test_installer_fail_fast.py tests/test_installer_env_backup_scope.py tests/test_component_modes.py
